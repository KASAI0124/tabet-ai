<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFAF1">
<title>Tabet-ai（タベタイ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0 }
sc-if, sc-for { display: contents }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent }
button:focus-visible { outline: 3px solid #2E2219; outline-offset: 2px }
input:focus { outline: none }
.inp:focus-within { box-shadow: 0 0 0 3px #2E2219 }
.sc { scrollbar-width: none }
.sc::-webkit-scrollbar { display: none }
.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.nd { fill: none; stroke: #FBE3A6; stroke-width: 3.2; stroke-linecap: round }
.rd { fill: none; stroke: #FFFFFF; stroke-width: 10; stroke-linecap: round }
.rd2 { fill: none; stroke: #FFFFFF; stroke-width: 5; stroke-linecap: round }
.rise { animation: rise .35s ease-out both }
.td { animation: td 1s ease-in-out infinite }
.td2 { animation-delay: .15s }
.td3 { animation-delay: .3s }
@keyframes rise {
  from { opacity: 0; transform: translateY(10px) }
  to { opacity: 1; transform: none }
}
@keyframes td {
  0%, 100% { opacity: .3; transform: translateY(0) }
  50% { opacity: 1; transform: translateY(-3px) }
}
@media (prefers-reduced-motion: reduce) {
  .rise, .td { animation: none }
}

html, body { height: 100%; }
body { margin: 0; background: #FFFAF1; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
#app { height: 100%; }
.app { width: 100%; height: 100vh; height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
@media (min-width: 500px) {
  body { background: #EFE4D3; }
  #app { display: flex; align-items: center; justify-content: center; }
  .app { width: 390px; height: min(844px, calc(100vh - 32px)); height: min(844px, calc(100dvh - 32px)); padding-bottom: 0; border-radius: 36px; box-shadow: 0 24px 60px rgba(46, 34, 25, 0.18); }
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="app" style="box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; position: relative; background: #FFFAF1; color: #2E2219; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; font-size: 15px; line-height: 1.5">

<div style="height: 52px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px">
  <div style="width: 32px; height: 32px; flex: none; border-radius: 12px; background: #F28A3C; color: #2E2219; display: flex; align-items: center; justify-content: center">
    <svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0z"></path><path d="M9.5 7c0-1.5 1.5-1.5 1.5-3M13.5 7c0-1.5 1.5-1.5 1.5-3"></path></svg>
  </div>
  <div style="flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px">
    <div style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 18px; letter-spacing: 0.01em">Tabet-ai</div>
    <div style="font-size: 12px; font-weight: 700; color: #5A4D42">タベタイ</div>
  </div>
  <sc-if value="{{canRestart}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{restart}}" style="flex: none; height: 44px; padding: 0 10px; border: 0; background: transparent; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #5A4D42">
      <svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"></path><path d="M4 4.500v4.500h4.500"></path></svg>
      はじめから
    </button>
  </sc-if>
</div>

<sc-if value="{{isFlow}}" hint-placeholder-val="{{ true }}">
  <div aria-label="ステップ" style="flex: none; position: relative; padding: 0 16px 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <div style="position: absolute; left: 60px; right: 60px; top: 11px; height: 2px; background: #EADCC8"></div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: {{sp.a.bg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; transition: background .25s ease">
        <sc-if value="{{sp.a.num}}" hint-placeholder-val="{{ true }}">1</sc-if>
        <sc-if value="{{sp.a.done}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
      </div>
      <div style="font-size: 12px; white-space: nowrap; font-weight: {{sp.a.w}}; color: {{sp.a.tc}}">どこで・誰と</div>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: {{sp.b.bg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; transition: background .25s ease">
        <sc-if value="{{sp.b.num}}" hint-placeholder-val="{{ true }}">2</sc-if>
        <sc-if value="{{sp.b.done}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
      </div>
      <div style="font-size: 12px; white-space: nowrap; font-weight: {{sp.b.w}}; color: {{sp.b.tc}}">何食べたい？</div>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: {{sp.c.bg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; transition: background .25s ease">
        <sc-if value="{{sp.c.num}}" hint-placeholder-val="{{ true }}">3</sc-if>
        <sc-if value="{{sp.c.done}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
      </div>
      <div style="font-size: 12px; white-space: nowrap; font-weight: {{sp.c.w}}; color: {{sp.c.tc}}">AIが考える</div>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px">
      <div style="width: 24px; height: 24px; border-radius: 50%; background: {{sp.d.bg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; transition: background .25s ease">
        <sc-if value="{{sp.d.num}}" hint-placeholder-val="{{ true }}">4</sc-if>
        <sc-if value="{{sp.d.done}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
      </div>
      <div style="font-size: 12px; white-space: nowrap; font-weight: {{sp.d.w}}; color: {{sp.d.tc}}">今日の提案</div>
    </div>
  </div>
</sc-if>

<sc-if value="{{showStrip}}" hint-placeholder-val="{{ false }}">
  <div style="flex: none; padding: 2px 16px 10px; border-bottom: 1.5px solid #F1E6D6; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="font-size: 12px; font-weight: 700; color: #5A4D42">今日食べる人</div>
      <div style="display: flex; align-items: center; gap: 6px">
        <div style="font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 999px; background: #FFEBD6; color: #8A3209">{{placeLabel}}</div>
        <div style="font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #2E2219; color: #FFFAF1">{{countText}}</div>
      </div>
    </div>
    <div style="display: flex; gap: 10px">
      <sc-for list="{{strip}}" as="m" hint-placeholder-count="1">
        <div style="min-width: 56px; display: flex; flex-direction: column; align-items: center; gap: 3px">
          <div style="width: 36px; height: 36px; border-radius: 50%; background: {{m.color}}; opacity: {{m.op}}; display: flex; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: {{m.fs}}; transition: opacity .3s ease">{{m.ch}}</div>
          <div style="font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 999px; white-space: nowrap; background: {{m.ansBg}}; color: {{m.ansColor}}; border: 1.5px solid {{m.ansBorder}}">{{m.ans}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</sc-if>

<div style="flex: 1; min-height: 0; position: relative">

<sc-if value="{{isWho}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column">
  <div class="sc" style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 12px">

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 34px; line-height: 1.22; letter-spacing: 0.01em">今日はどこで、<br>誰と食べる？</h1>
        <svg viewBox="0 0 120 120" width="84" height="84" aria-hidden="true" style="flex: none">
          <rect x="97" y="12" width="5" height="96" rx="2.5" fill="#B4430F" transform="rotate(10 99 60)"></rect>
          <rect x="107" y="12" width="5" height="96" rx="2.5" fill="#B4430F" transform="rotate(10 109 60)"></rect>
          <circle cx="50" cy="62" r="46" fill="#6DB58A"></circle>
          <circle cx="50" cy="62" r="38" fill="#FFFDF7"></circle>
          <circle cx="42" cy="54" r="15" fill="#FFF3D6"></circle>
          <circle cx="42" cy="54" r="7.5" fill="#F5A623"></circle>
          <rect x="54" y="68" width="24" height="9" rx="4.5" fill="#F26B5B" transform="rotate(-18 66 72)"></rect>
          <rect x="34" y="78" width="22" height="8" rx="4" fill="#C98566" transform="rotate(14 45 82)"></rect>
          <circle cx="66" cy="48" r="3.2" fill="#6DB58A"></circle>
          <circle cx="72" cy="57" r="3.2" fill="#8CCB7A"></circle>
          <circle cx="61" cy="88" r="3.2" fill="#8CCB7A"></circle>
        </svg>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="background: #E1F2E5; border-radius: 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 12px; font-weight: 700; color: #1F5233">今の目標</div>
          <div style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 14px; line-height: 1.4">{{goal.label}}</div>
        </div>
        <div style="background: #FFEBD6; border-radius: 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 12px; font-weight: 700; color: #8A3209">最近の傾向</div>
          <div style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 14px; line-height: 1.4">野菜と鉄分が不足しやすい</div>
        </div>
      </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 700; color: #5A4D42">どこで食べる？</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" aria-pressed="{{place.home.on}}" onClick="{{place.home.pick}}" style="min-height: 64px; box-sizing: border-box; border-radius: 20px; border: 2.5px solid {{place.home.border}}; background: {{place.home.bg}}; padding: 8px 12px; display: flex; align-items: center; gap: 10px; text-align: left; transition: background .2s ease">
          <svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="flex: none"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"></path></svg>
          <div>
            <div style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 17px; line-height: 1.3">家で食べる</div>
          </div>
        </button>
        <button type="button" aria-pressed="{{place.out.on}}" onClick="{{place.out.pick}}" style="min-height: 64px; box-sizing: border-box; border-radius: 20px; border: 2.5px solid {{place.out.border}}; background: {{place.out.bg}}; padding: 8px 12px; display: flex; align-items: center; gap: 10px; text-align: left; transition: background .2s ease">
          <svg class="ic" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="flex: none"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path><path d="M9 20v-6h6v6"></path></svg>
          <div>
            <div style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 17px; line-height: 1.3">外で食べる</div>
          </div>
        </button>
      </div>
    </div>

    <div style="font-size: 13px; font-weight: 700; color: #5A4D42; margin-bottom: -6px">誰と食べる？</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" aria-pressed="{{who.solo.on}}" onClick="{{who.solo.pick}}" style="position: relative; height: 124px; box-sizing: border-box; border-radius: 24px; border: 2.5px solid {{who.solo.border}}; background: {{who.solo.bg}}; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; transition: background .2s ease">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: #F26B5B; display: flex; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 13px">自分</div>
        <div>
          <div style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 22px; line-height: 1.3">ひとり</div>
        </div>
        <sc-if value="{{who.solo.on}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: #2E2219; color: #FFFAF1; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
        </sc-if>
      </button>
      <button type="button" aria-pressed="{{who.fam.on}}" onClick="{{who.fam.pick}}" style="position: relative; height: 124px; box-sizing: border-box; border-radius: 24px; border: 2.5px solid {{who.fam.border}}; background: {{who.fam.bg}}; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; transition: background .2s ease">
        <div style="display: flex">
          <div style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; border: 2px solid #FFFDF7; background: #F26B5B; display: flex; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 12px">自分</div>
          <div style="width: 40px; height: 40px; box-sizing: border-box; margin-left: -12px; border-radius: 50%; border: 2px solid #FFFDF7; background: #6DB58A; display: flex; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 16px">母</div>
          <div style="width: 40px; height: 40px; box-sizing: border-box; margin-left: -12px; border-radius: 50%; border: 2px solid #FFFDF7; background: #F28A3C; display: flex; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 16px">父</div>
          <div style="width: 40px; height: 40px; box-sizing: border-box; margin-left: -12px; border-radius: 50%; border: 2px solid #FFFDF7; background: #F4C542; display: flex; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 16px">弟</div>
        </div>
        <div>
          <div style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 22px; line-height: 1.3">家族と</div>
          <div style="font-size: 12px; font-weight: 700; color: #5A4D42">みんなにちょうどいい</div>
        </div>
        <sc-if value="{{who.fam.on}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: #2E2219; color: #FFFAF1; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
        </sc-if>
      </button>
    </div>

    <sc-if value="{{who.any}}" hint-placeholder-val="{{ false }}">
      <div class="rise" style="background: #FFFFFF; border: 1.5px solid #F1E6D6; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <div style="font-size: 13px; font-weight: 700; color: #5A4D42">今日食べる人</div>
          <div style="font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #2E2219; color: #FFFAF1">{{countText}}</div>
        </div>
        <sc-for list="{{who.rows}}" as="m" hint-placeholder-count="1">
          <button type="button" aria-pressed="{{m.on}}" onClick="{{m.toggle}}" style="min-height: 52px; box-sizing: border-box; border-radius: 16px; border: 2px solid {{m.border}}; background: {{m.bg}}; padding: 6px 10px; display: flex; align-items: center; gap: 10px; text-align: left">
            <div style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: {{m.color}}; opacity: {{m.op}}; display: flex; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: {{m.fs}}">{{m.ch}}</div>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 15px; font-weight: 700; line-height: 1.3">{{m.name}}</div>
              <div style="font-size: 12px; font-weight: 500; color: #5A4D42">{{m.note}}</div>
            </div>
            <sc-if value="{{m.on}}" hint-placeholder-val="{{ true }}">
              <div style="width: 26px; height: 26px; flex: none; border-radius: 50%; background: #2B6E45; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
            </sc-if>
            <sc-if value="{{m.off}}" hint-placeholder-val="{{ false }}">
              <div style="flex: none; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #FFE3DE; color: #8F2A1E">{{m.awayLabel}}</div>
            </sc-if>
          </button>
        </sc-for>
        <sc-if value="{{who.fam.on}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 12px; font-weight: 500; color: #5A4D42; text-align: center">{{who.hint}}</div>
        </sc-if>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <button type="button" aria-expanded="{{quick.open}}" onClick="{{quick.toggle}}" style="min-height: 52px; box-sizing: border-box; border-radius: 18px; border: 2px dashed #D8C9B6; background: #FFFFFF; padding: 8px 14px; display: flex; align-items: center; gap: 10px; text-align: left">
        <svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="flex: none"><path d="M12 5v14M5 12h14"></path></svg>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 700; line-height: 1.3">突発的に食べたものを登録</div>
        </div>
      </button>
      <sc-if value="{{quick.open}}" hint-placeholder-val="{{ false }}">
        <div class="rise" style="background: #FFFFFF; border: 1.5px solid #F1E6D6; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
          <div style="font-size: 13px; font-weight: 700; color: #5A4D42">いつ食べた？</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{quick.slots}}" as="q" hint-placeholder-count="4">
              <button type="button" aria-pressed="{{q.on}}" onClick="{{q.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; background: {{q.bg}}; border: 2px solid {{q.border}}; font-size: 14px; font-weight: 700">{{q.label}}</button>
            </sc-for>
          </div>
          <div style="font-size: 13px; font-weight: 700; color: #5A4D42">何を食べた？</div>
          <div class="inp" style="height: 52px; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px; background: #FFFFFF; border: 2px solid #EADCC8; border-radius: 16px">
            <input type="text" aria-label="突発的に食べたもの" value="{{quick.text}}" onChange="{{quick.onText}}" onKeyDown="{{quick.onKey}}" placeholder="例：コンビニのからあげ、ケーキ" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; font: inherit; font-size: 16px; color: #2E2219">
          </div>
          <button type="button" onClick="{{quick.add}}" style="height: 48px; border: 0; border-radius: 999px; background: {{quick.addBg}}; color: #FFFFFF; font-size: 15px; font-weight: 700">履歴に登録する</button>
        </div>
      </sc-if>
      <sc-if value="{{quick.hasDone}}" hint-placeholder-val="{{ false }}">

    var s = this.st();
    var p = this._prev || {};
    var cur = { step: s.step, tab: s.tab, famPhase: s.famPhase, famN: s.famN, whyOpen: s.whyOpen, chosen: s.chosen, fb: s.fb, loc: s.loc, recipeOpen: s.recipeOpen };
    this._prev = cur;
    if (s.tab !== 'home') return;
    var scrollWant = s.step === 'want' && s.famPhase > 0 && (p.famPhase !== s.famPhase || p.famN !== s.famN);
    var scrollRes = s.step === 'result' && p.step === 'result' && (
      (p.chosen !== s.chosen && s.chosen) ||
      (p.fb !== s.fb && s.fb) ||
      (p.whyOpen !== s.whyOpen && s.whyOpen && !s.chosen && s.loc === 0 && !s.recipeOpen) ||
      (p.recipeOpen !== s.recipeOpen && s.recipeOpen && !s.chosen)
    );
    if (!scrollWant && !scrollRes) return;
    setTimeout(function () {
      var el = scrollWant ? self._want : self._res;
      if (el && el.scrollTo) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    }, 90);
  }

  isGroup(s) { return s.who === 'fam' && (s.mo || s.fa || s.br); }

  seq(s) {
    var q = ['sent'];
    if (s.mo) q.push('mo1');
    if (s.fa) q.push('fa1');
    if (s.br) { q.push('br1'); q.push('ai'); q.push('br2'); }
    if (s.fa && (s.mo || s.br)) q.push('fa2');
    q.push('ready');
    return q;
  }

  famRun(delay) {
    var self = this;
    clearTimeout(this._t3);
    var tick = function () {
      var s = self.st();
      var q = self.seq(s);
      var n = s.famN;
      if (n >= q.length) return;
      if (q[n] === 'br2' && !s.famChoice) return;
      self.setState({ famN: n + 1 });
      self._t3 = setTimeout(tick, 950);
    };
    this._t3 = setTimeout(tick, delay || 600);
  }

  startThink() {
    var self = this;
    clearTimeout(this._t);
    clearTimeout(this._t2);
    clearTimeout(this._t3);
    this.setState({ step: 'think', thinkN: 0, whyOpen: false, chosen: false, fb: null, a1: true, a2: true, a3: true, loc: 0, shop: 's1', shopGo: null, recipeOpen: false, cand: 0 });
    var tick = function () {
      var n = self.st().thinkN;
      if (n >= 5) {
        self._t = setTimeout(function () {
          var goOut = self.st().place === 'out';
          self.setState({ step: 'result', loc: goOut ? 1 : 0 });
          if (goOut) self._t2 = setTimeout(function () { self.setState({ loc: 2 }); }, 1400);
        }, 700);
        return;
      }
      self.setState({ thinkN: n + 1 });
      self._t = setTimeout(tick, 480);
    };
    this._t = setTimeout(tick, 500);
  }

  variantOf(t) {
    if (/ラーメン|らーめん/.test(t)) return 'ramen';
    if (/がっつり|ガッツリ/.test(t)) return 'gat';
    if (/コンビニ/.test(t)) return 'conbini';
    if (/外食|お店|韓国/.test(t)) return 'eatout';
    if (/料理したくない|作りたくない|めんどう|面倒/.test(t)) return 'nocook';
    if (/なんでも|何でも|おまかせ|お任せ/.test(t)) return 'any';
    return 'free';
  }

  pickText(s) {
    return [s.pAct, s.pGenre, s.pStaple].filter(function (x) { return !!x; }).join('・');
  }

  variantOfPick(s, free) {
    var fv = free ? this.variantOf(free) : 'free';
    if (fv !== 'free') return fv;
    if (s.pStaple === '麺' && (!s.pGenre || s.pGenre === '中華')) return 'ramen';
    if (s.pGenre || s.pStaple) return 'pick';
    if (s.pAct === '料理したくない') return 'nocook';
    if (s.pAct === '料理する') return 'any';
    return free ? 'free' : 'ramen';
  }

  answer(text) {
    var s = this.st();
    var group = this.isGroup(s);
    var free = String(text || '').trim();
    var picked = this.pickText(s);
    var t = [picked, free].filter(function (x) { return !!x; }).join('・');
    if (!t) return;
    if (group) {
      this.setState({ myWish: t, famPhase: 1, famN: 0, famChoice: null, query: '' });
      return;
    }
    this.setState({ myWish: t, variant: picked ? this.variantOfPick(s, free) : this.variantOf(free), query: '' });
    this.startThink();
  }

      rcData = GROUP_RECIPES[s.famChoice] || GROUP_RECIPES.karaage;
      rcIngs = rcData.ings.concat(SALAD);
    } else if (!out && RECIPES[s.variant] && !(s.cand > 0)) {
      rcData = RECIPES[s.variant];
      rcIngs = rcData.ings.slice();
      addKeys.forEach(function (k, i) { if (s[k]) rcIngs.push(rcData.addIngs[i]); });
    }
    var rc = {
      show: !!rcData,
      open: !!rcData && !!s.recipeOpen,
      label: s.recipeOpen ? 'レシピをとじる' : 'レシピを見る',
      time: rcData ? rcData.time : '',
      meta: rcData ? (rcData.time + '・' + (group ? n : 1) + '人分') : '',
      ings: rcIngs.map(function (x) { return { name: x[0], qty: x[1] }; }),
      steps: rcData ? rcData.steps.map(function (t, i) { return { num: i + 1, text: t }; }) : [],
      tip: rcData ? (group ? 'あなたは生のトマトが苦手だから、サラダはトマトなしにしているよ。' : rcData.tip) : '',
      toggle: function () { self.setState({ recipeOpen: !s.recipeOpen }); }
    };

    var todayPfc = group ? [32, 18, 80] : soloPfc;

    var ACTS = { 'ひくい': 1.4, 'ふつう': 1.55, 'たかい': 1.75 };
    var P0 = s.prof || {};
    var pnum = function (x, d) { var n2 = parseFloat(x); return isFinite(n2) && n2 > 0 ? n2 : d; };
    var PROF = { sex: P0.sex || '女性', age: pnum(P0.age, 24), h: pnum(P0.h, 160), w: pnum(P0.w, 52), actLabel: P0.act || 'ふつう' };
    PROF.act = ACTS[PROF.actLabel];
    var setProf = function (k, val) { var np = Object.assign({}, self.st().prof || {}); np[k] = val; self.setState({ prof: np, profDone: '' }); };
    var profUi = {
      open: !!s.profOpen,
      btn: s.profOpen ? '個人情報をとじる' : '個人情報を登録する',
      summary: PROF.sex + '・' + PROF.age + '歳・' + PROF.h + 'cm・' + PROF.w + 'kg・活動量' + PROF.actLabel + (P0.allergy ? '・アレルギー：' + P0.allergy : ''),
      toggle: function () { self.setState({ profOpen: !s.profOpen, profDone: '' }); },
      sexes: ['女性', '男性'].map(function (x) { var on = PROF.sex === x; return { label: x, on: on, bg: on ? '#FFEBD6' : '#FFFFFF', border: on ? '#2E2219' : '#EADCC8', pick: function () { setProf('sex', x); } }; }),
      acts: ['ひくい', 'ふつう', 'たかい'].map(function (x) { var on = PROF.actLabel === x; return { label: x, on: on, bg: on ? '#FFEBD6' : '#FFFFFF', border: on ? '#2E2219' : '#EADCC8', pick: function () { setProf('act', x); } }; }),
      age: P0.age != null ? P0.age : PROF.age, h: P0.h != null ? P0.h : PROF.h, w: P0.w != null ? P0.w : PROF.w, allergy: P0.allergy || '',
      on: {
        age: function (e) { setProf('age', e.target.value); },
        h: function (e) { setProf('h', e.target.value); },
        w: function (e) { setProf('w', e.target.value); },
        allergy: function (e) { setProf('allergy', e.target.value); }
      },
      save: function () { self.setState({ profOpen: false, profDone: '個人情報を登録しました。PFCの必要量に反映しています。' }); },
      done: s.profDone || '', hasDone: !!s.profDone
    };
    var bmr = 10 * PROF.w + 6.25 * PROF.h - 5 * PROF.age + (PROF.sex === '男性' ? 5 : -161);
    var kcal = Math.round(bmr * PROF.act * G.f / 10) * 10;
    var need = [Math.round(kcal * G.r[0] / 4), Math.round(kcal * G.r[1] / 9), Math.round(kcal * G.r[2] / 4)];
    var got = [28, 24, 150];
    var logAll = s.log || [];
    var lastLog = logAll[logAll.length - 1];
    var ate = !!(lastLog && lastLog.pfc);
    if (ate) got = got.map(function (x, i) { return x + lastLog.pfc[i]; });
    var pfcNames = ['たんぱく質', '脂質', '炭水化物'];
    var pfcTags = ['P', 'F', 'C'];
    var pfcColors = ['#E0652B', '#E2A21B', '#4E9E5C'];
    var lowI = 0;
    var pfcRows = need.map(function (nd, i) {
      var left = Math.max(0, nd - got[i]);
      if (i !== 1 && got[i] / nd < got[lowI] / need[lowI]) lowI = i;
      return {
        name: pfcNames[i], tag: pfcTags[i], color: pfcColors[i],
        now: got[i], need: nd,
        pct: Math.min(100, Math.round(got[i] / nd * 100)) + '%',
        leftText: left > 0 ? ('あと ' + left + ' g') : '今日のぶんは足りています',
        leftFg: left > 0 ? '#B4430F' : '#1F5233',
        aria: pfcNames[i] + '：必要量' + nd + 'gのうち' + got[i] + 'g'
      };
    });
    var lowLeft = Math.max(0, need[lowI] - got[lowI]);
    var pfcNote = lowLeft === 0
      ? '今日のぶんは、もうしっかりとれているよ。'
      : (ate
        ? ('今日のごはんで、ぐっと近づいたね。' + pfcNames[lowI] + 'はあと' + lowLeft + 'g。')
        : (pfcNames[lowI] + 'があと' + lowLeft + 'g。食べたいものに、ちょっと足せばOK。'));
    var pfc = {
      kcal: String(kcal).replace(/\B(?=(\d{3})+(?!\d))/g, ','),
      basis: PROF.sex + '・' + PROF.age + '歳・' + PROF.h + 'cm・' + PROF.w + 'kg・活動量' + PROF.actLabel + ' から算出',
      rows: pfcRows,
      caption: ate ? '今日とった量（朝・昼・夜）' : '今日とった量（朝・昼）',
      note: pfcNote
    };

    var E = 'eat', B = 'buy';
    var SHOPS = {
      ramen: [
        ['麺屋 こがね', E, '徒歩4分・濃厚味噌', '濃い味好きに、いちばん近い一杯', '味噌ラーメン＋ほうれん草・味玉', '麺少なめが選べて、最近少なめの野菜と鉄分も足せる'],
        ['らーめん あかり', E, '徒歩7分・鶏白湯', '鶏肉好き・こってり派のあなたに', '鶏白湯ラーメン＋ねぎ増し・味玉', 'ねぎ増しで、野菜をちょっとプラス'],
        ['近くのコンビニ', B, '徒歩2分・チルド麺', '買って帰って、家で食べるなら', 'チルド味噌ラーメン＋おひたし・味玉', 'レンジだけでOK。足りない分は小鉢で買える']
      ],
      gat: [
        ['どんぶり処 まる', E, '徒歩5分・丼もの', '辛いもの好きに、いちばん合いそう', '豚キムチ丼＋温泉卵・ナムル', 'ごはん少なめが選べて、ナムルで野菜と鉄分も'],
        ['焼肉定食 だいち', E, '徒歩8分・定食', 'がっつり派・濃い味好きのあなたに', '焼肉定食＋ほうれん草のおひたし', '小鉢で野菜を足せる'],
        ['駅前スーパー', B, '徒歩6分・お惣菜', '買って帰って、家で食べるなら', '豚キムチ丼弁当＋わかめスープ', 'お惣菜コーナーで野菜も一緒に買える']
      ],
      conbini: [
        ['近くのコンビニ', B, '徒歩2分', 'いつもの組み合わせが、いちばん近くで', 'おにぎり＋サラダチキン＋おひたし', '最近少なめの野菜と鉄分を、ひとつ足せる'],
        ['駅前スーパー', B, '徒歩6分・お惣菜', '野菜のお惣菜が選びやすい', 'おにぎり＋サラダチキン＋ごま和え', 'コンビニより野菜の小鉢が多い'],
        ['おむすび屋 こめこ', E, '徒歩8分・おむすび', '卵料理好きのあなたに', 'おむすび定食＋だし巻き卵・味噌汁', 'お店で食べれば、わかめの味噌汁も付く']
      ],
      eatout: [
        ['韓国ごはん ひだまり', E, '徒歩5分・スンドゥブ', '辛いもの好きに、いちばん合いそう', 'スンドゥブ定食＋ナムル・卵', '辛さが選べて、ナムルで野菜と鉄分も足せる'],
        ['ソウル食堂 まる', E, '徒歩8分・ビビンバ', '濃い味好き・卵料理好きのあなたに', '石焼ビビンバ＋わかめスープ', '野菜たっぷり。ごはん少なめも選べる'],
        ['駅前スーパー', B, '徒歩6分・お惣菜', '買って帰って、家で食べるなら', 'スンドゥブの素＋豆腐・卵・ほうれん草', '温めるだけ。野菜も一緒に買える']
      ]
    };
    var shopSet = null;
    if (out && group) {
      shopSet = [
        ['和ごはん こはる', E, '徒歩6分・定食', 'みんなの希望がそろう一軒', ch.dish + '＋野菜たっぷり和風サラダ', '肉も野菜もしっかり。' + n + '人でも入りやすい'],
        ['ファミリー食堂 まんぷく', E, '徒歩9分・ファミレス', 'メニューが多くて、みんな選びやすい', ch.main + '＋サラダバー', 'サラダバーで野菜を足せる'],
        ['駅前スーパー', B, '徒歩5分・お惣菜', '買って帰って、家で食べるなら', ch.main + '（お惣菜）＋カットサラダ', '作らなくてOK。' + n + '人分まとめて買える']
      ];
    } else if (out) {
      shopSet = SHOPS[s.variant] || [
        ['キッチン ひなた', E, '徒歩5分・定食', '濃い味好きのあなたに合いそう', v.dish + '＋小鉢のおひたし', '小鉢で、最近少なめの野菜と鉄分を足せる'],
        ['駅前スーパー', B, '徒歩6分・お惣菜', '買って帰って、家で食べるなら', v.dish + '（お惣菜）＋カットサラダ', '作らなくてOK。野菜も一緒に買える'],
        ['近くのコンビニ', B, '徒歩2分', 'いちばん近くで、すぐ買える', v.dish + '＋わかめスープ', '足りない分を、ひとつ足せる']
      ];
    }
    var pinPos = [['60%', '24%'], ['17%', '58%'], ['84%', '66%']];
    var shops = (shopSet || []).map(function (d, i) {
      var id = 's' + (i + 1);
      var open = s.shop === id;
      var eat = d[1] === E;
      return {
        num: i + 1, name: d[0], meta: d[2], match: d[3], order: d[4], note: d[5],
        kind: eat ? 'お店で食べる' : '買って帰る',
        kindBg: eat ? '#FFEBD6' : '#E1F2E5',
        kindFg: eat ? '#8A3209' : '#1F5233',
        orderLabel: eat ? 'ここで頼むなら' : 'ここで買うなら',
        cta: eat ? 'ここで食べる' : 'ここで買う',
        open: open, gone: s.shopGo === id, canGo: open && !s.chosen,
        border: open ? '#2E2219' : '#F1E6D6',
        pinBg: open ? '#2E2219' : '#F28A3C',
        pinColor: open ? '#FFFAF1' : '#2E2219',
        left: pinPos[i][0], top: pinPos[i][1],
        pick: function () { self.setState({ shop: id }); },
        go: function () {
          var log = (s.log || []).slice();
          log.push({ dish: d[4] + '（' + d[0] + '）', who: todayWho, fb: '', pfc: todayPfc });
          self.setState({ shopGo: id, chosen: true, log: log });
        }
      };
    });
    var loc = {
      busy: !!shopSet && s.loc === 1,
      done: !!shopSet && s.loc === 2,
      title: '近くで食べられる・買えるお店',
      basis: group ? 'みんなの「食べたい」と好みから選びました' : '辛いもの好き・濃い味好き・パクチーは苦手、から選びました',
      shops: shops
    };
    var placeCard = function (id) {
      var on = s.place === id;
      return {
        on: on,
        border: on ? '#2E2219' : '#F1E6D6',
        bg: on ? '#FFEBD6' : '#FFFFFF',
        pick: function () { self.setState({ place: id }); }
      };
    };

    if (!this._wantRef) this._wantRef = function (el) { self._want = el; };
    if (!this._resRef) this._resRef = function (el) { self._res = el; };

    return {
      isFlow: flow,
      isWho: flow && s.step === 'who',
      isWant: flow && s.step === 'want',
      isThink: flow && s.step === 'think',
      isResult: flow && s.step === 'result',
      isHistory: s.tab === 'history',
      isMe: s.tab === 'me',
      showStrip: flow && (s.step === 'want' || s.step === 'result'),
      canRestart: flow && s.step !== 'who',
      restart: function () { self.restart(); },

      sp: { a: stp(0), b: stp(1), c: stp(2), d: stp(3) },
      nav: { home: tab('home'), history: tab('history'), me: tab('me') },

      who: {
        any: !!s.who,
        ready: !!s.who && !!s.place,
        needPlace: !!s.who && !s.place,
        hint: out ? '一緒に食べない人は、タップで外せます' : '今日は外で食べる人は、タップで外せます',
        solo: whoCard('solo'),
        fam: whoCard('fam'),
        rows: whoRows,
        cta: group ? ('この' + n + '人で、何食べたいか考えよう') : '何食べたいか、考えよう'
      },
      countText: countText,
      homeLine: homeLine,
      place: { home: placeCard('home'), out: placeCard('out') },
      placeLabel: out ? '外で食べる' : '家で食べる',
      pfc: pfc,
      loc: loc,
      rc: rc,
      toWant: function () {
        self.setState({ step: 'want', myWish: '', query: '', famPhase: 0, famN: 0, famChoice: null, pAct: null, pGenre: null, pStaple: null });
      },

      strip: strip,

      query: s.query,
      onQuery: function (e) { self.setState({ query: e.target.value }); },
      onKey: function (e) {
        if (e.key === 'Enter' && !(e.nativeEvent && e.nativeEvent.isComposing)) self.answer(self.st().query);
      },
      submit: function () { self.answer(self.st().query); },
      myWish: s.myWish,
      wantRef: this._wantRef,
      resRef: this._resRef,

      w: {
        groupIntro: group && s.famPhase === 0,
        asking: s.famPhase === 0,
        answered: group && s.famPhase >= 1,
        chips: wantChips,
        cats: wantCats,
        canGo: canGo,
        goBg: canGo ? '#B4430F' : '#C9BBA8',
        goLabel: canGo ? (group ? 'これで伝える' : 'これで考えてもらう') : '1つ以上えらんでね',
        hint: group ? 'みんなの「食べたい」を集めて、ひとつの献立にまとめるよ。' : '今日はまだ野菜少なめ。でも、食べたいものから考えてOK。',
        affirm: /肉/.test(s.myWish || '') ? 'お肉いいね！' : 'いいね！'
      },

      f: {
        sent: vis('sent'),
        sentTo: sentNames.join('・'),
        awayTag: out ? '今日は一緒に食べない' : '今日は家で食べない',
        awayMsg: out ? '今日は別で食べて帰ります' : '今日は外で食べて帰ります',
        mo1: vis('mo1'),
        fa1: vis('fa1'),
        br1: vis('br1'),
        ai: vis('ai'),
        choosing: choosing,
        br2: vis('br2'),
        fa2: vis('fa2'),
        choiceLabel: ch.label,
        pick: { curry: pickFn('curry'), karaage: pickFn('karaage'), shoga: pickFn('shoga'), pasta: pickFn('pasta') },
        bar: group && s.famPhase >= 1,
        barSend: s.famPhase === 1,
        barWait: s.famPhase === 2 && !choosing && !ready,
        barPick: choosing,
        barReady: ready,
        send: function () { self.setState({ famPhase: 2, famN: 0, famChoice: null }); self.famRun(300); },
        summarize: function () { self.startThink(); }
      },

      think: {
        title: group ? (n + '人のことを考えています') : 'あなたのことを考えています',
        people: eaters.map(function (id) { return { ch: M[id].ch, color: M[id].color, fs: M[id].fs === '16px' ? '20px' : '14px' }; }),
        items: thinkItems
      },

      resSolo: !group,
      resGroup: group,
      sr: {
        affirm: v.affirm, line: v.line, dish: v.dish, msg: v.msg, memo: v.memo, concl: v.concl,
        isRamen: s.variant === 'ramen', notRamen: s.variant !== 'ramen',
        cands: soloCands,
        adds: adds, l1: layer('a1'), l2: layer('a2'), l3: layer('a3'),
        why: soloWhy
      },
      g: {
        dish: ch.dish, main: ch.main,
        servings: n + '人分',
        oneNote: out ? 'みんなの希望がそろう一軒にすれば、お店選びで迷わなくて大丈夫。' : '作るのは、この献立ひとつだけ。一人ひとり別の料理は作らなくて大丈夫。',
        why: gWhy
      },

      whyOpen: !!s.whyOpen,
      toggleWhy: function () { self.setState({ whyOpen: !s.whyOpen }); },
      chosen: !!s.chosen,
      notChosen: !s.chosen,
      canChoose: !s.chosen && !out,
      choose: function () {
        var log = (s.log || []).slice();
        log.push({ dish: todayDish, who: todayWho, fb: '', pfc: todayPfc });
        self.setState({ chosen: true, log: log });
      },
      doneLine: group ? '決定！家族みんなに共有しました。' : '今日のごはんに決定。履歴にも入れておいたよ。',

      fb: {
        opts: fbOpts,
        done: !!s.fb,
        none: !s.fb,
        reply: s.fb ? FB[s.fb].reply : ''
      },

      quick: quick,
      goal: goal,
      prof: profUi,
      hist: { days: histDays },
      me: { learned: learned }
    };
  }
}

__start(Component);
</script>
